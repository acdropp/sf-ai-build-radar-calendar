<style>
  /* SF AI Build Radar — Calendar view (Phase 1)
     Dark charcoal dashboard, Archivo + JetBrains Mono, one ultramarine accent.
     A single shared reference month drives three consecutive calendars. */
  :root {
    --bg: #0d0f13;
    --surface: #15181e;
    --surface-2: #1c2027;
    --surface-3: #22262f;
    --fg: #e9ecf1;
    --muted: #9aa3b2;
    --faint: #6b7484;
    --line: #262b33;
    --line-strong: #333a44;
    --accent: #7f93ff;
    --accent-weak: rgba(127, 147, 255, 0.14);
    --accent-line: rgba(127, 147, 255, 0.45);
    --accent-fg: #0d0f13;
    --amber: #f0b254;
    --amber-weak: rgba(240, 178, 84, 0.16);
    --dot-on: #7f93ff;
    --dot-off: #333a44;
    --today: #7f93ff;
    --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }

  /* Light theme — the SF AI Build Radar digest palette (cool paper + ink, ultramarine accent) */
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --surface-3: #e4e7ec;
    --fg: #16181d;
    --muted: #5b6472;
    --faint: #8b93a1;
    --line: #e2e5ea;
    --line-strong: #d2d7df;
    --accent: #2d44f0;
    --accent-weak: rgba(45, 68, 240, 0.10);
    --accent-line: rgba(45, 68, 240, 0.40);
    --accent-fg: #ffffff;
    --amber: #a85c00;
    --amber-weak: rgba(168, 92, 0, 0.12);
    --dot-on: #2d44f0;
    --dot-off: #cdd3dd;
    --today: #2d44f0;
    color-scheme: light;
  }
  /* Soft paper shadows in light mode (dark mode leans on borders instead) */
  :root[data-theme="light"] .cal,
  :root[data-theme="light"] .lrow,
  :root[data-theme="light"] .tbc { box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.05); }
  :root[data-theme="light"] .daypop,
  :root[data-theme="light"] .modal { box-shadow: 0 14px 40px rgba(16, 24, 40, 0.18); }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 76px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }

  /* Header */
  header.app {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.1) blur(10px);
    border-bottom: 1px solid var(--line);
    margin: 0 -16px 20px;
    padding: 14px 16px;
  }
  .headrow {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  h1 .spark { color: var(--accent); }
  .sub { font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); margin-top: 3px; }
  .btn-today {
    font-family: var(--font-body);
    font-weight: 650; font-size: 0.85rem;
    color: var(--accent-fg); background: var(--accent);
    border: none; border-radius: 9px; padding: 8px 16px; cursor: pointer;
    transition: filter 0.12s ease;
  }
  .btn-today:hover { filter: brightness(1.08); }
  .btn-today:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* TBC shelf */
  .tbc {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-top: 20px;
  }
  .tbc h2 {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  details.tbc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; }
  details.tbc > summary::-webkit-details-marker { display: none; }
  details.tbc > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .tbc-count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); background: var(--surface-2); border-radius: 20px; padding: 1px 9px; }
  .tbc-chev { width: 15px; height: 15px; color: var(--faint); margin-left: auto; transition: transform 0.15s ease; flex: none; }
  details.tbc[open] > summary .tbc-chev { transform: rotate(90deg); }
  details.tbc[open] .tbc-items { margin-top: 10px; }
  .tbc .tbc-items { display: flex; flex-wrap: wrap; gap: 8px; }
  details.tbc:not([open]) .tbc-items { display: none; }  /* author display:flex would otherwise beat the UA closed-details rule */
  details.tbc.squeezed { display: none !important; }     /* dropped in short landscape to keep the calendar readable */
  .tbc-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; text-decoration: none; color: var(--fg);
    max-width: 320px;
  }
  .tbc-chip:hover { border-color: var(--line-strong); }
  .tbc-chip .when { font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); white-space: nowrap; }
  .tbc-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Calendars stacked vertically, one month above the next (portrait / tall tiles) */
  .cals {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .cals[hidden] { display: none; }   /* the class rule above would otherwise beat the hidden attribute */

  /* Landscape / wide tile: one month grows to fill the tile for large, readable day blocks. */
  @media (orientation: landscape) {
    html, body { height: 100%; }
    .wrap {
      max-width: 1500px; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
      padding: 0 20px 14px;
    }
    header.app { position: static; margin: 0 -20px 14px; padding: 12px 20px; }
    footer.legend { flex: 0 0 auto; margin-top: 14px; padding-top: 12px; }
    .tbc { margin-top: 14px; flex: 0 0 auto; }
    /* List view scrolls normally even in landscape — the single-month fill only applies to the calendar */
    body.view-list .wrap { height: auto; overflow: visible; padding-bottom: 48px; }
    body.view-list header.app { position: sticky; top: 0; }

    .cals.one { flex: 1 1 auto; min-height: 0; }
    .cals.one .cal { height: 100%; display: flex; flex-direction: column; }
    .cals.one .cal-head { flex: 0 0 auto; }
    .cals.one .cal-title { font-size: 1.2rem; }
    .cals.one .dow { flex: 0 0 auto; }
    .cals.one .dow span { font-size: 0.68rem; }
    .cals.one .grid { flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr; }
    .cals.one .cell { min-height: 0; }
    .cals.one .dnum { font-size: 0.82rem; }
    .cals.one .ev { font-size: 0.76rem; -webkit-line-clamp: 3; }
    .cals.one .ev .t { font-size: 0.68rem; }
  }

  /* Portrait / tall tile: stack months, each sized so at least two show at once; scroll for more. */
  @media (orientation: portrait) {
    .cals .cal { min-height: 44dvh; }
    .cals .grid { flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr; }
    .cals .cell { min-height: 0; }
  }

  .cal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 16px;
    display: flex; flex-direction: column;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .cal-title {
    font-weight: 700; font-size: 1rem; letter-spacing: -0.01em;
    background: none; border: none; color: var(--fg); cursor: pointer;
    padding: 5px 9px; border-radius: 8px; font-family: var(--font-body);
  }
  .cal-title:hover { background: var(--surface-2); }
  .cal-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-title .yr { color: var(--faint); font-weight: 500; }
  .nav {
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; font-size: 1rem; line-height: 1; flex: none;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav:hover { background: var(--surface-3); color: var(--fg); }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
  .dow span {
    text-align: center; font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600;
    letter-spacing: 0.04em; color: var(--faint); text-transform: uppercase; padding: 2px 0;
  }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cell {
    background: var(--surface-2); border: 1px solid transparent;
    border-radius: 7px; min-height: 82px; padding: 5px 5px 6px;
    display: flex; flex-direction: column; gap: 3px; overflow: hidden;
  }
  .cell.blank { background: transparent; }
  .cell.has:hover { border-color: var(--line); cursor: pointer; }
  .cell .dnum { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 1px; }
  .cell.today { border-color: var(--accent-line); background: var(--accent-weak); }
  .cell.today .dnum { color: var(--accent); font-weight: 600; }
  /* Past days stay on the calendar but are dimmed, like low-fit/unverified events */
  .cell.past { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
  .cell.past .dnum { color: var(--faint); }
  .cell.past .ev { opacity: 0.4; }

  /* Event chips inside a day cell */
  .ev {
    text-decoration: none; color: var(--fg);
    background: var(--surface-3); border-left: 2px solid var(--line-strong);
    border-radius: 4px; padding: 2px 5px; font-size: 0.66rem; line-height: 1.2;
    overflow: hidden; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .ev.s-high { border-left-color: var(--accent); background: var(--accent-weak); }
  .ev.s-mid  { border-left-color: var(--line-strong); }
  .ev.s-low  { opacity: 0.5; }
  .ev.verify { border-left-style: dashed; opacity: 0.5; }
  .ev .nbadge { color: var(--accent); font-weight: 700; margin-right: 2px; }
  .more {
    font-family: var(--font-mono); font-size: 0.62rem; color: var(--accent);
    background: none; border: none; cursor: pointer; text-align: left; padding: 1px 5px;
  }
  .more:hover { text-decoration: underline; }

  /* Modal (shared by month picker + day detail) */
  .overlay {
    position: fixed; inset: 0; background: rgba(5, 6, 9, 0.6);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 14px; padding: 18px; width: 100%; max-width: 380px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
  }
  .modal h3 { margin: 0 0 14px; font-size: 1rem; font-weight: 700; }
  .modal.wide { max-width: 440px; }
  .field { display: flex; gap: 10px; margin-bottom: 14px; }
  .field label { flex: 1; display: flex; flex-direction: column; gap: 5px; font-size: 0.72rem; color: var(--muted); }
  select, input[type="number"] {
    font-family: var(--font-body); font-size: 0.9rem;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .mbtn { font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; border-radius: 8px; padding: 8px 15px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg); }
  .mbtn:hover { background: var(--surface-3); }
  .mbtn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .mbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Day-detail event rows */
  .detail-day { font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); margin: -6px 0 12px; }
  .drow { display: block; text-decoration: none; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; }
  .drow:hover { border-color: var(--line-strong); }
  .drow .dr-top { display: flex; align-items: baseline; gap: 8px; }
  .drow .dr-name { font-weight: 650; font-size: 0.9rem; }
  .drow .dr-meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meter { display: inline-flex; gap: 2px; margin-left: auto; align-items: center; }
  .meter i { width: 6px; height: 6px; border-radius: 50%; background: var(--dot-off); }
  .meter i.on { background: var(--dot-on); }
  .pill { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.03em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; font-weight: 600; }
  .pill.new { background: var(--accent); color: var(--accent-fg); }
  .pill.dist { background: var(--amber-weak); color: var(--amber); }
  .pill.verify { background: var(--surface-3); color: var(--muted); border: 1px dashed var(--line-strong); }

  /* Corner "+N ▲" affordance on crowded days */
  .morepill {
    position: absolute; right: 4px; bottom: 4px; z-index: 2;
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 0.58rem; font-weight: 600; color: var(--accent);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 20px; padding: 1px 6px 1px 7px;
    pointer-events: none; /* the whole cell is the click target */
  }
  .morepill .tri {
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 5px solid var(--accent);
  }
  .cell.crowded { padding-bottom: 14px; }

  /* Anchored day popover */
  .daypop {
    position: fixed; z-index: 60; width: 300px; max-width: calc(100vw - 24px); max-height: 70vh;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; overflow: hidden;
  }
  .daypop[hidden] { display: none; }
  .dp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px 9px; border-bottom: 1px solid var(--line); flex: none; }
  .dp-title { margin: 0; font-size: 0.82rem; font-weight: 700; }
  .dp-close { background: none; border: none; color: var(--faint); font-size: 1.15rem; line-height: 1; cursor: pointer; padding: 0 2px; }
  .dp-close:hover { color: var(--fg); }
  .dp-list { overflow-y: auto; padding: 9px 10px; display: flex; flex-direction: column; gap: 7px; overscroll-behavior: contain; }
  .dp-row { display: block; text-decoration: none; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
  .dp-row:hover, .dp-row.sel { border-color: var(--accent-line); background: var(--accent-weak); }
  .dp-row .r-top { display: flex; align-items: baseline; gap: 8px; }
  .dp-row .r-name { font-weight: 650; font-size: 0.85rem; }
  .dp-row .r-meta { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px 9px; }
  .dp-row .meter { margin-left: auto; }

  /* View toggle (Calendar / List) */
  .head-right { display: flex; align-items: center; gap: 10px; }
  .viewtoggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .vt { font-family: var(--font-body); font-weight: 600; font-size: 0.82rem; color: var(--muted); background: none; border: none; border-radius: 7px; padding: 6px 13px; cursor: pointer; transition: background 0.12s ease, color 0.12s ease; }
  .vt[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
  .vt:not([aria-selected="true"]):hover { color: var(--fg); }
  .vt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Theme toggle icon */
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; transition: background 0.12s ease, color 0.12s ease; }
  .icon-btn:hover { background: var(--surface-3); color: var(--fg); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-sun { display: block; }
  .icon-moon { display: none; }
  :root[data-theme="light"] .icon-sun { display: none; }
  :root[data-theme="light"] .icon-moon { display: block; }

  /* List view (the scored digest) */
  .listview { display: flex; flex-direction: column; gap: 26px; }
  .listview[hidden] { display: none; }
  .lsec { }
  .lsec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
  .lsec-head h2 { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg); margin: 0; }
  .lsec-head .count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); background: var(--surface-2); border-radius: 20px; padding: 1px 9px; }
  .lsec-head .rule { flex: 1; height: 1px; background: var(--line); }
  .lsec-chev { width: 15px; height: 15px; color: var(--faint); flex: none; transition: transform 0.15s ease; }
  .lsec-hint { font-size: 0.82rem; color: var(--faint); margin: 0; }
  .lrows { display: flex; flex-direction: column; gap: 8px; }

  /* Collapsible list sections */
  details.lsec > summary { list-style: none; cursor: pointer; padding: 3px 0; }
  details.lsec > summary::-webkit-details-marker { display: none; }
  details.lsec > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  details.lsec[open] > summary .lsec-chev { transform: rotate(90deg); }
  details.lsec > .lsec-hint { margin-top: 10px; }
  details.lsec > .lrows, details.lsec > .lpanel, details.lsec > .trackgrid { margin-top: 12px; }
  details.lsec:not([open]) > *:not(summary) { display: none !important; }  /* beat author display:flex/grid on closed sections */

  /* Collapsible event row */
  details.lrow {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-strong); border-radius: 12px; overflow: hidden;
  }
  details.lrow[open] { border-color: var(--line-strong); }
  details.lrow.flag-new { border-left-color: var(--accent); }
  details.lrow.past { opacity: 0.6; }
  details.lrow summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: grid; grid-template-columns: 56px 1fr auto 18px; column-gap: 12px; row-gap: 3px;
    grid-template-areas: "date main score chev" "date meta score chev";
    align-items: start;
  }
  details.lrow summary::-webkit-details-marker { display: none; }
  details.lrow summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .l-date { grid-area: date; font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .l-date .tbc { color: var(--faint); font-weight: 500; font-size: 0.72rem; }
  .l-main { grid-area: main; min-width: 0; }
  .l-name { font-weight: 650; font-size: 0.95rem; letter-spacing: -0.01em; }
  .l-warn { font-size: 0.9rem; }
  .l-emoji { font-size: 0.95rem; letter-spacing: 0.04em; white-space: nowrap; margin-left: 2px; }
  .l-meta { grid-area: meta; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .l-meta .setting { color: var(--faint); }
  .l-badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .l-score { grid-area: score; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding-top: 2px; }
  .l-score .meter { display: inline-flex; gap: 2px; margin: 0; }
  .l-score .num { font-family: var(--font-mono); font-size: 0.66rem; color: var(--faint); }
  .l-chev { grid-area: chev; width: 16px; height: 16px; color: var(--faint); align-self: center; transition: transform 0.15s ease; }
  details.lrow[open] .l-chev { transform: rotate(90deg); }

  /* Expanded detail */
  .l-detail { padding: 2px 14px 16px; border-top: 1px solid var(--line); }
  .l-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0 0; }
  .l-detail dt { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); padding-top: 2px; }
  .l-detail dd { margin: 0; font-size: 0.86rem; }
  .l-themes { margin: 14px 0 0; padding-left: 18px; }
  .l-themes li { font-size: 0.86rem; margin-bottom: 4px; }
  .l-fit { margin-top: 14px; padding: 10px 12px; background: var(--accent-weak); border-radius: 8px; font-size: 0.86rem; }
  .l-fit b { font-family: var(--font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); display: block; margin-bottom: 3px; }
  .l-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .l-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 650; font-size: 0.84rem; padding: 7px 13px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
  .l-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .l-actions .src { font-family: var(--font-mono); font-size: 0.7rem; color: var(--faint); word-break: break-all; }
  @media (max-width: 560px) {
    details.lrow summary { grid-template-columns: 50px 1fr 16px; grid-template-areas: "date main chev" "date meta chev" "date score chev"; }
    .l-score { align-items: flex-start; flex-direction: row; gap: 10px; margin-top: 4px; }
  }

  /* Legend */
  footer.legend { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer.legend .k { display: inline-flex; align-items: center; gap: 6px; }
  footer.legend .sw { width: 10px; height: 10px; border-radius: 3px; border-left: 2px solid; }
  .sw.high { border-left-color: var(--accent); background: var(--accent-weak); }
  .sw.mid { border-left-color: var(--line-strong); background: var(--surface-3); }
  .sw.low { border-left-color: var(--line-strong); background: var(--surface-3); opacity: 0.5; }

  .empty-note { color: var(--faint); font-size: 0.85rem; padding: 20px; text-align: center; }

  /* Filter bar — one bordered, collapsible card (matches the TBC shelf) */
  .filterbar { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  details.filterbar > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; }
  details.filterbar > summary::-webkit-details-marker { display: none; }
  details.filterbar > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  details.filterbar > summary h2 { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .fb-chev { width: 15px; height: 15px; color: var(--faint); transition: transform 0.15s ease; flex: none; }
  details.filterbar[open] > summary .fb-chev { transform: rotate(90deg); }
  .fb-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  details.filterbar:not([open]) .fb-body { display: none; }
  .filterbar.filtered > summary h2 { color: var(--accent); }
  .fb-search { position: relative; display: flex; align-items: center; }
  .fb-search svg { position: absolute; left: 12px; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .fb-search input { width: 100%; font: inherit; font-size: 0.9rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 35px; }
  .fb-search input::placeholder { color: var(--faint); }
  .fb-search input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-weak); }
  .fb-chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .fchip { font: inherit; font-size: 0.78rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease; }
  .fchip:hover { border-color: var(--line-strong); color: var(--fg); }
  .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fchip.on { background: var(--accent-weak); border-color: var(--accent-line); color: var(--accent); }
  .fchip.clear { color: var(--faint); background: transparent; border-color: transparent; }
  .fchip.clear:hover { color: var(--fg); background: var(--surface-2); }
  .fb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; flex: none; }
  .fb-count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); margin-left: auto; }
  @media (max-width: 560px) { .fb-sep { display: none; } }

  /* Stale-data banner */
  .stale { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 0.82rem;
    background: var(--amber-weak); color: var(--amber); border: 1px solid transparent; display: flex; gap: 8px; align-items: baseline; }
  .stale[hidden] { display: none; }
  .stale b { font-weight: 700; }

  /* Secondary actions in the expanded list detail (add-to-calendar) */
  .l-btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent-line); }
  .l-btn.ghost:hover { background: var(--accent-weak); }

  /* What's-new highlight + coverage/tracked panels (list view) */
  .lsec.whatsnew .lsec-head h2 { color: var(--accent); }
  .lpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .lpanel.gaps { border-left: 3px solid var(--amber); }
  .lpanel ul { margin: 0; padding-left: 18px; }
  .lpanel li { font-size: 0.84rem; margin-bottom: 7px; color: var(--muted); }
  .lpanel li:last-child { margin-bottom: 0; }
  .trackgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .track { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .track .t-name { font-weight: 650; font-size: 0.85rem; }
  .track .t-why { color: var(--muted); font-size: 0.76rem; margin-top: 3px; line-height: 1.4; }
  .track a { color: var(--accent); text-decoration: none; font-family: var(--font-mono); font-size: 0.7rem; display: inline-block; margin-top: 6px; word-break: break-all; }

  /* Mobile list refinements */
  @media (max-width: 560px) {
    .wrap { }
    details.lrow summary { padding: 10px 12px; column-gap: 9px; }
    .l-name { font-size: 0.9rem; }
    .l-detail { padding: 2px 12px 14px; }
    .l-detail dl { grid-template-columns: 1fr; gap: 1px 0; }
    .l-detail dt { padding-top: 8px; }
    .l-detail dt:first-child { padding-top: 0; }
    .trackgrid { grid-template-columns: 1fr; }
  }

  /* Print: a clean, expanded weekly handout */
  @media print {
    header.app, .viewtoggle, .btn-today, .icon-btn, .l-chev, .l-actions, .stale, .filterbar,
    .nav, .cal-head .cal-title, .daypop, .overlay, footer.legend { display: none !important; }
    body, .wrap { background: #fff; color: #000; }
    .wrap { max-width: 100%; height: auto; overflow: visible; padding: 0; }
    details.lrow { break-inside: avoid; border: 1px solid #ccc !important; box-shadow: none !important; }
    details.lrow .l-detail { display: block !important; border-top: 1px solid #ddd; }
    details.lrow summary { pointer-events: none; }
    .lpanel, .track { border: 1px solid #ccc !important; break-inside: avoid; }
    .cals { display: none !important; }        /* print the list, not the grid */
    .listview { display: flex !important; }
  }
</style>

    dist: "all",                // "all" | "sf"  (SF-proper only)
    hide: false,                // hide unverified / low-fit (≤2)
    q: ""                       // keyword search
  };
  var pickerPanelIndex = 0;     // which calendar's heading opened the picker
  var VIEW_KEY = "radar-view";

  if (view !== "list") view = "calendar";

  // ----- Pure date helpers -----
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateKey(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function addDaysISO(iso, n) {
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);

  }

  function scoreTier(ev) {

  // ----- Data loading: live file first, embedded fallback second -----
  function normalize(data) {

  }
  // Apply the active filters to rawEvents, repopulating the structures both views read.
  function rebuild() {
    var list = rawEvents.filter(matchesFilters);

    byDate = {};
    tbc = [];
    list.forEach(function (ev) {
      if (ev.date) { (byDate[ev.date] = byDate[ev.date] || []).push(ev); }
      else { tbc.push(ev); }
    });
    // Within a day, sort by score desc then start time
    Object.keys(byDate).forEach(function (k) {
      byDate[k].sort(function (a, b) {

      });

  }

  // Source bucket from the free-text source field ("Luma / BuilderBase" -> "Luma").
  function sourceCat(ev) {
    var s = (ev.source || "").toLowerCase();
    if (s.indexOf("hacker dojo") >= 0 || s.indexOf("hackerdojo") >= 0) return "Hacker Dojo";
    if (s.indexOf("luma") >= 0) return "Luma";
    if (s.indexOf("meetup") >= 0) return "Meetup";
    return "Other";
  }
  function matchesFilters(ev) {
    if (filters.minScore && (ev.score || 0) < filters.minScore) return false;
    if (filters.sources && filters.sources.indexOf(sourceCat(ev)) < 0) return false;
    if (filters.setting !== "all") {
      var st = (ev.setting || "").toLowerCase();
      var inperson = st.indexOf("in-person") >= 0 || st.indexOf("in person") >= 0 || st.indexOf("hybrid") >= 0;
      var online = st.indexOf("online") >= 0 || st.indexOf("hybrid") >= 0 || st.indexOf("virtual") >= 0 || st.indexOf("remote") >= 0;
      if (filters.setting === "inperson" && !inperson) return false;
      if (filters.setting === "online" && !online) return false;
    }
    if (filters.dist === "sf" && regionInfo(ev).warn) return false;   // SF-proper (and online) only
    if (filters.hide && (ev.needsVerification || (ev.score || 0) <= 2)) return false;
    if (filters.q) {
      var hay = [ev.name, ev.venue, ev.city, ev.address, ev.fit,
        (ev.themes || []).join(" "), (ev.tags || []).join(" ")].join(" ").toLowerCase();

  function loadData() {
    return fetch("./data/events.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .catch(function () {

  // ----- Rendering -----
  function buildCell(y, m, d, t) {
    var key = dateKey(y, m, d);

    var isToday = (t && y === t.y && m === t.m && d === t.d);
    var isPast = t && key < dateKey(t.y, t.m, t.d);   // whole day already passed
    var crowded = evs.length > chipCap;
    var cls = "cell" + (evs.length ? " has" : "") + (isToday ? " today" : "") + (crowded ? " crowded" : "") + (isPast ? " past" : "");
    var html = '<div class="' + cls + '"' + (evs.length ? ' data-day="' + key + '"' : "") + '>';
    html += '<span class="dnum">' + d + "</span>";

    var shown = evs.slice(0, chipCap);
    shown.forEach(function (ev) {
      var tier = scoreTier(ev);
      var nb = ev.status === "new" ? '<span class="nbadge">•</span>' : "";
      var t2 = timeStr(ev);
      var tip = (t2 ? t2 + "  ·  " : "") + ev.name;
      html += '<a class="ev s-' + tier + (ev.needsVerification ? " verify" : "") + '" href="' + esc(ev.url) + '" target="_blank" rel="noopener" title="' + esc(tip) + '">' +
        nb + esc(ev.name) + "</a>";
    });
    if (crowded) {
      html += '<span class="morepill">+' + (evs.length - chipCap) + '<span class="tri"></span></span>';
    }
    html += "</div>";
    return html;
  }

  function buildCalendar(y, m, panelIndex, t) {
    var fw = firstWeekday(y, m);
    var dim = daysInMonth(y, m);
    var weeks = Math.ceil((fw + dim) / 7);
    var cells = weeks * 7;

    var html = '<section class="cal">';
    html += '<div class="cal-head">';
    html += '<button class="nav" type="button" data-nav="prev" aria-label="Previous month">‹</button>';
    html += '<button class="cal-title" type="button" data-pick="' + panelIndex + '">' +
      MONTHS[m] + ' <span class="yr">' + y + "</span></button>";
    html += '<button class="nav" type="button" data-nav="next" aria-label="Next month">›</button>';
    html += "</div>";

    html += '<div class="dow">' + DOW.map(function (d) { return "<span>" + d + "</span>"; }).join("") + "</div>";

    html += '<div class="grid">';
    for (var i = 0; i < cells; i++) {
      var dayNum = i - fw + 1;
      if (dayNum < 1 || dayNum > dim) {
        html += '<div class="cell blank"></div>';
      } else {
        html += buildCell(y, m, dayNum, t);
      }
    }
    html += "</div></section>";
    return html;
  }

  // Landscape / wide tile shows ONE month filling the view; portrait stacks three.
  function singleMode() {
    return window.matchMedia("(orientation: landscape)").matches;
  }

  function render() {
    var t = today();
    var host = document.getElementById("cals");
    var count = singleMode() ? 1 : 3;
    host.classList.toggle("one", count === 1);
    chipCap = (count === 1) ? 2 : CHIP_CAP;  // fewer chips per day in the height-constrained fill view
    var html = "";
    for (var i = 0; i < count; i++) {
      var mm = addMonths(ref.y, ref.m, i);
      html += buildCalendar(mm.y, mm.m, i, t);
    }
    host.innerHTML = html;

    // sub line
    var sub;
    if (count === 1) {
      sub = MONTHS[ref.m] + " " + ref.y;
    } else {
      var c = addMonths(ref.y, ref.m, 2);
      sub = MONTHS_SHORT[ref.m] + " " + ref.y + " – " + MONTHS_SHORT[c.m] + " " + c.y;
    }
    if (meta && meta.generatedAt) {
      sub += "  ·  data as of " + String(meta.generatedAt).slice(0, 10);
    }
    document.getElementById("sub").textContent = sub;
    adjustTbc();
  }

  // Landscape single-month fill: keep the calendar readable. If showing the TBC
  // shelf would squeeze the grid rows below a legible height, drop it from view.
  function adjustTbc() {
    var el = document.getElementById("tbcShelf");
    if (!el) return;
    if (!(view === "calendar" && singleMode()) || !tbc.length) { el.classList.remove("squeezed"); return; }
    el.classList.remove("squeezed");                 // measure with it shown
    var cell = document.querySelector(".cals.one .grid .cell:not(.blank)");
    if (!cell) return;
    var MINCELL = 74;                                // below this, day cells clip their chips
    if (cell.getBoundingClientRect().height < MINCELL) el.classList.add("squeezed");
  }

  function renderTBC() {
    var shelf = document.getElementById("tbcShelf");
    var host = document.getElementById("tbcItems");
    if (!tbc.length) { shelf.hidden = true; return; }
    shelf.hidden = false;
    document.getElementById("tbcCount").textContent = tbc.length;
    host.innerHTML = tbc.map(function (ev) {
      var when = ev.dateDisplay || "TBC";
      return '<a class="tbc-chip" href="' + esc(ev.url) + '" target="_blank" rel="noopener">' +
        '<span class="when">' + esc(when) + '</span>' +
        '<span class="nm">' + esc(ev.name) + "</span></a>";
    }).join("");
  }

  // ----- List view (collapsible digest rows, reading the same events) -----
  function mmddNum(iso) {                 // "2026-10-12" -> "10/12"
    var p = iso.split("-");
    return p[1] + "/" + p[2];
  }
  function timeStr(ev) {                  // "9:00 AM–2:00 PM" | "9:00 AM" | "time ?"

    if (ev.startTime) return ev.startTime;
    return "time ?";
  }

  // Normalize a scraped tag ("🦾 hackathon", "🛠️ build") to a canonical
  // {emoji,label} from Aaron's legend; unknown keywords keep their own emoji.
  var FMT_MAP = {
    hackathon: ["🦾", "hackathon"],
    build: ["🛠", "collaborative build"], buildathon: ["🛠", "collaborative build"],
    workshop: ["🛠", "collaborative build"], jam: ["🛠", "collaborative build"],
    demo: ["🎤", "live demo"], showcase: ["🎤", "live demo"],
    discussion: ["🗣", "discussion"], panel: ["🗣", "discussion"], talk: ["👩🏽‍🏫", "lecture"],
    lecture: ["👩🏽‍🏫", "lecture"], seminar: ["👩🏽‍🏫", "lecture"], class: ["👩🏽‍🏫", "lecture"],
    networking: ["🍻", "networking"], social: ["🍻", "networking"], mixer: ["🍻", "networking"],
    happy: ["🍻", "networking"], meetup: ["🍻", "networking"],
    book: ["📚", "book club"], reading: ["📚", "book club"]

  function fmtTags(ev) {
    var out = [], seen = {};
    (ev.tags || []).forEach(function (raw) {
      var s = String(raw).trim();
      var sp = s.indexOf(" ");
      var emoji = sp > 0 ? s.slice(0, sp) : s;
      var word = sp > 0 ? s.slice(sp + 1).trim() : "";
      var key = word.toLowerCase().split(/[\s/]+/)[0];
      var m = FMT_MAP[key];

      if (!seen[pair.emoji]) { seen[pair.emoji] = 1; out.push(pair); }
    });

  }

  // Region / out-of-SF flag. Returns {warn, label} ; label null when in SF.
  var SOUTH_BAY = ["menlo park", "palo alto", "san jose", "santa clara", "mountain view",
    "sunnyvale", "cupertino", "redwood city", "los altos", "san mateo", "milpitas", "fremont"];
  var EAST_BAY = ["oakland", "berkeley", "emeryville", "alameda", "richmond", "san leandro"];
  function regionInfo(ev) {
    var setting = (ev.setting || "").toLowerCase();
    var city = (ev.city || "").toLowerCase().trim();
    var blob = (city + " " + (ev.venue || "")).toLowerCase();
    var onlineish = /\b(online|virtual|remote|globally|global|livestream|zoom)\b/.test(blob);
    // Pure-online events have no geography — accessible from SF, so no out-of-town flag.
    if (setting === "online") return { warn: false, label: null };
    if (ev.distanceNote) {
      var head = ev.distanceNote.split("—")[0].trim();
      if (/east bay/i.test(head)) return { warn: true, label: "East Bay" };
      if (/south bay|peninsula/i.test(head)) return { warn: true, label: "South Bay" };
    }
    if (!city && onlineish) return { warn: false, label: null };
    if (!city) return { warn: false, label: null };
    if (city.indexOf("san francisco") >= 0 || city === "sf") return { warn: false, label: null };
    var hit = function (arr) { return arr.some(function (c) { return city.indexOf(c) >= 0; }); };
    if (hit(SOUTH_BAY)) return { warn: true, label: "South Bay" };
    if (hit(EAST_BAY)) return { warn: true, label: "East Bay" };
    if (onlineish) return { warn: true, label: "Online" };   // hybrid/remote, not local
    return { warn: true, label: ev.city };                   // out of SF, region unknown
  }

  function meterHtml(score) {
    var m = "";
    for (var k = 1; k <= 5; k++) m += '<i class="' + (k <= score ? "on" : "") + '"></i>';
    return '<span class="meter" aria-label="score ' + score + ' of 5">' + m + "</span>" +
      '<span class="num">' + score + "/5</span>";
  }

  // ----- Add to calendar: .ics data-URI (with VTIMEZONE) + Google Calendar link -----
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function parse12h(t) {                 // "9:00 AM" -> {h,m} 24h, or null
    if (!t) return null;
    var m = String(t).trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/);
    if (!m) return null;
    var h = +m[1], mn = +m[2], ap = (m[3] || "").toUpperCase();

    if (ap === "AM" && h === 12) h = 0;
    return { h: h, m: mn };
  }
  function stamp(iso, hm) { var p = iso.split("-"); return p[0] + p[1] + p[2] + "T" + pad2(hm.h) + pad2(hm.m) + "00"; }
  function dateCompact(iso) { var p = iso.split("-"); return p[0] + p[1] + p[2]; }
  function icsEscape(s) {
    return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  }
  function calWindow(ev) {                // {allDay,start,end} in local wall time, or null
    if (!ev.date) return null;
    var st = parse12h(ev.startTime), en = parse12h(ev.endTime);
    if (!st) return { allDay: true, start: dateCompact(ev.date), end: dateCompact(addDaysISO(ev.date, 1)) };
    var endIso = ev.date, endHm = en;
    if (en) {

    } else {

  var VTZ =
    "BEGIN:VTIMEZONE\r\nTZID:America/Los_Angeles\r\n" +
    "BEGIN:DAYLIGHT\r\nTZOFFSETFROM:-0800\r\nTZOFFSETTO:-0700\r\nTZNAME:PDT\r\nDTSTART:19700308T020000\r\nRRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU\r\nEND:DAYLIGHT\r\n" +
    "BEGIN:STANDARD\r\nTZOFFSETFROM:-0700\r\nTZOFFSETTO:-0800\r\nTZNAME:PST\r\nDTSTART:19701101T020000\r\nRRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU\r\nEND:STANDARD\r\n" +
    "END:VTIMEZONE\r\n";

    var loc = [ev.venue, ev.address, ev.city].filter(Boolean).join(", ");
    var desc = [];
    if (ev.fit) desc.push("Why it fits: " + ev.fit);
    if (ev.url) desc.push(ev.url);
    if (ev.source) desc.push("Source: " + ev.source);
    var dt = w.allDay
      ? "DTSTART;VALUE=DATE:" + w.start + "\r\nDTEND;VALUE=DATE:" + w.end
      : "DTSTART;TZID=America/Los_Angeles:" + w.start + "\r\nDTEND;TZID=America/Los_Angeles:" + w.end;
    var uid = String(ev.id || ev.name).replace(/[^a-z0-9]+/gi, "-") + "@sf-ai-build-radar";
    var n = new Date();
    var dtstamp = n.getUTCFullYear() + pad2(n.getUTCMonth() + 1) + pad2(n.getUTCDate()) + "T" +
      pad2(n.getUTCHours()) + pad2(n.getUTCMinutes()) + pad2(n.getUTCSeconds()) + "Z";
    return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//SF AI Build Radar//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n" +
      (w.allDay ? "" : VTZ) +
      "BEGIN:VEVENT\r\nUID:" + uid + "\r\nDTSTAMP:" + dtstamp + "\r\n" + dt + "\r\n" +
      "SUMMARY:" + icsEscape(ev.name) + "\r\n" +
      (loc ? "LOCATION:" + icsEscape(loc) + "\r\n" : "") +
      (desc.length ? "DESCRIPTION:" + icsEscape(desc.join("\n")) + "\r\n" : "") +
      (ev.url ? "URL:" + icsEscape(ev.url) + "\r\n" : "") +

  function icsHref(ev) { var t = icsText(ev); return t ? "data:text/calendar;charset=utf-8," + encodeURIComponent(t) : null; }

    return "https://calendar.google.com/calendar/render?action=TEMPLATE" +

      "&dates=" + w.start + "/" + w.end +

      (details.length ? "&details=" + encodeURIComponent(details.join("\n\n")) : "");
  }

  // ----- Stale-data banner: warn if the last sync is more than ~36h old -----
  function renderStale() {
    var el = document.getElementById("staleBanner");
    if (!el) return;
    var gen = meta && meta.generatedAt ? new Date(meta.generatedAt) : null;
    if (!gen || isNaN(gen.getTime())) { el.hidden = true; return; }
    var hrs = (Date.now() - gen.getTime()) / 36e5;
    if (hrs <= 36) { el.hidden = true; return; }
    var ago = hrs >= 48 ? (Math.floor(hrs / 24) + " days") : (Math.floor(hrs) + " hours");
    el.innerHTML = '<span><b>⚠ Data may be stale.</b> Last sync was ' + esc(ago) + ' ago (' +
      esc(meta.lastRunLabel || String(meta.generatedAt).slice(0, 10)) +
      '). The daily refresh may have stopped — check before relying on this.</span>';

  }

  var CHEV = '<svg class="l-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  function lrow(ev, isPast) {
    var score = ev.score || 0;
    var reg = regionInfo(ev);
    var fmts = fmtTags(ev);

    var dateCell = ev.date
      ? "<span>" + esc(mmddNum(ev.date)) + "</span>"
      : '<span class="tbc">TBC</span>';
    var time = timeStr(ev);
    var loc = esc([ev.venue, ev.city].filter(Boolean).join(", ")) || "—";
    var setting = esc(ev.setting || "in-person");

    var emojiRun = fmts.length
      ? ' <span class="l-emoji" title="' + esc(fmts.map(function (f) { return f.label; }).join(" · ")) + '">' +
        fmts.map(function (f) { return f.emoji; }).join(" ") + "</span>"
      : "";
    var warnMark = reg.warn ? '<span class="l-warn" title="Outside San Francisco">⚠️</span> ' : "";

    var badges = "";
    if (ev.status === "new") badges += '<span class="pill new">new</span>';
    if (reg.label) badges += '<span class="pill dist">' + esc(reg.label) + "</span>";
    if (ev.needsVerification) badges += '<span class="pill verify">verify</span>';

    // ---- expanded detail ----
    var whenVal = (ev.date ? esc(mmddNum(ev.date)) : esc(ev.dateDisplay || "To be confirmed")) +
      " · " + esc(time) + " " + esc(ev.tz || "PT");
    var whereVal = esc(ev.venue || "—") +
      (ev.address ? ", " + esc(ev.address) : "") +
      (ev.city && (ev.venue || "").indexOf(ev.city) < 0 ? ", " + esc(ev.city) : "");
    var settingVal = setting + (ev.distanceNote ? " · " + esc(ev.distanceNote) : "");
    var admVal = esc(ev.price || "Not shown") + " · " + esc(ev.membership || "Membership not stated");
    var fmtVal = fmts.length
      ? fmts.map(function (f) { return f.emoji + " " + esc(f.label); }).join(" · ")
      : "—";
    var dl =
      "<dt>When</dt><dd>" + whenVal + "</dd>" +
      "<dt>Where</dt><dd>" + whereVal + "</dd>" +
      "<dt>Setting</dt><dd>" + settingVal + "</dd>" +
      "<dt>Admission</dt><dd>" + admVal + "</dd>" +
      "<dt>Format</dt><dd>" + fmtVal + "</dd>" +
      "<dt>Source</dt><dd>" + esc(ev.source || "—") + "</dd>";

    var themes = (ev.themes || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    var url = ev.url || "#";

    return '<details class="lrow' + (ev.status === "new" ? " flag-new" : "") + (isPast ? " past" : "") + '">' +
      "<summary>" +
        '<span class="l-date">' + dateCell + "</span>" +
        '<span class="l-main"><span class="l-name">' + warnMark + esc(ev.name) + "</span>" + emojiRun + "</span>" +
        '<span class="l-score">' + meterHtml(score) + "</span>" +
        CHEV +
        '<span class="l-meta"><span class="t">' + esc(time) + '</span><span class="loc">' + loc +

          (badges ? '<span class="l-badges">' + badges + "</span>" : "") +
        "</span>" +
      "</summary>" +
      '<div class="l-detail">' +
        "<dl>" + dl + "</dl>" +
        (themes ? '<ul class="l-themes">' + themes + "</ul>" : "") +
        (ev.fit ? '<div class="l-fit"><b>Why it fits you</b>' + esc(ev.fit) + "</div>" : "") +
        '<div class="l-actions"><a class="l-btn" href="' + esc(url) + '" target="_blank" rel="noopener">Open event ↗</a>' +
          (ev.date && icsHref(ev) ? '<a class="l-btn ghost" href="' + icsHref(ev) + '" download="' + esc(String(ev.id || "event")) + '.ics">Add to calendar</a>' : "") +
          (ev.date && gcalHref(ev) ? '<a class="l-btn ghost" href="' + esc(gcalHref(ev)) + '" target="_blank" rel="noopener">Google Calendar</a>' : "") +
          (urlShort ? '<span class="src">' + urlShort + "</span>" : "") +
        "</div>" +
      "</div>" +
    "</details>";
  }
  // Per-section collapse state (remembered per viewer). Defaults per Aaron's spec.
  var SEC_PREFIX = "radar-sec-";
  var secDefaults = { whatsnew: false, thisweek: true, upcoming: true, tbc: false, past: false, gaps: false, tracked: false };
  var secState = {};
  Object.keys(secDefaults).forEach(function (k) {
    var v = null;
    try { v = localStorage.getItem(SEC_PREFIX + k); } catch (e) {}
    secState[k] = (v === null) ? secDefaults[k] : (v === "1");
  });
  var SEC_CHEV = '<svg class="lsec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  function secHead(title, count) {
    return '<summary><div class="lsec-head"><h2>' + esc(title) + "</h2>" +
      '<span class="count">' + count + '</span><span class="rule"></span>' + SEC_CHEV + "</div></summary>";
  }

  function lsection(title, hint, rows, cls, key) {
    if (!rows.length) return "";
    var open = key ? secState[key] : true;
    return '<details class="lsec' + (cls ? " " + cls : "") + '" data-sec="' + esc(key || "") + '"' + (open ? " open" : "") + ">" +
      secHead(title, rows.length) +
      (hint ? '<p class="lsec-hint">' + esc(hint) + "</p>" : "") +
      '<div class="lrows">' + rows.join("") + "</div></details>";
  }
  // Coverage-gaps + tracked-series panels, straight from the digest's meta/run.
  function gapsPanel() {
    if (!meta || !meta.gaps || !meta.gaps.length) return "";
    return '<details class="lsec" data-sec="gaps"' + (secState.gaps ? " open" : "") + ">" +
      secHead("Coverage gaps this run", meta.gaps.length) +
      '<p class="lsec-hint">What the radar knows is thin or unconfirmed — so you also see what it is <em>not</em> showing.</p>' +
      '<div class="lpanel gaps"><ul>' + meta.gaps.map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("") + "</ul></div></details>";
  }
  function trackedPanel() {
    if (!meta || !meta.tracked || !meta.tracked.length) return "";
    var cards = meta.tracked.map(function (tr) {
      return '<div class="track"><div class="t-name">' + esc(tr.name) + "</div>" +
        (tr.why ? '<div class="t-why">' + esc(tr.why) + "</div>" : "") +
        (tr.url ? '<a href="' + esc(tr.url) + '" target="_blank" rel="noopener">' + esc(tr.url.replace(/^https?:\/\//, "")) + " ↗</a>" : "") +
        "</div>";
    }).join("");
    return '<details class="lsec" data-sec="tracked"' + (secState.tracked ? " open" : "") + ">" +
      secHead("Recurring series on watch", meta.tracked.length) +
      '<p class="lsec-hint">Backbone communities the daily refresh checks for each new instance.</p>' +
      '<div class="trackgrid">' + cards + "</div></details>";
  }
  function renderList() {
    var t = today(), tk = dateKey(t.y, t.m, t.d), weekEnd = addDaysISO(tk, 6);
    var thisWeek = [], upcoming = [], past = [];
    allEvents.forEach(function (ev) {
      if (!ev.date) return;               // undated handled from `tbc`
      if (ev.date < tk) past.push(ev);
      else if (ev.date <= weekEnd) thisWeek.push(ev);
      else upcoming.push(ev);
    });
    var asc = function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (b.score || 0) - (a.score || 0); };
    var desc = function (a, b) { return a.date > b.date ? -1 : a.date < b.date ? 1 : (b.score || 0) - (a.score || 0); };
    var byScore = function (a, b) { return (b.score || 0) - (a.score || 0); };
    thisWeek.sort(asc); upcoming.sort(asc); past.sort(desc);
    var tbcSorted = tbc.slice().sort(byScore);
    var newItems = allEvents.filter(function (e) { return e.status === "new" && e.date && e.date >= tk; }).sort(asc);
    var newHint = (meta && meta.summary) ? meta.summary : "The newest finds from today's refresh.";
    var html =
      lsection("What's new since last run", newHint, newItems.map(function (e) { return lrow(e, false); }), "whatsnew", "whatsnew") +
      lsection("This week", "Dated events in the next 7 days. Tap a row to expand.", thisWeek.map(function (e) { return lrow(e, false); }), null, "thisweek") +
      lsection("Upcoming", "Soonest first; within a day, higher-scored first.", upcoming.map(function (e) { return lrow(e, false); }), null, "upcoming") +
      lsection("To be confirmed", "Real finds with a date or time still to pin down.", tbcSorted.map(function (e) { return lrow(e, false); }), null, "tbc") +
      lsection("Past", null, past.map(function (e) { return lrow(e, true); }), null, "past") +
      gapsPanel() + trackedPanel();
    var lv = document.getElementById("listView");
    lv.innerHTML = html || '<div class="empty-note">No events.</div>';
    // persist each section's collapse state as the viewer toggles it
    [].forEach.call(lv.querySelectorAll("details.lsec[data-sec]"), function (d) {
      d.addEventListener("toggle", function () {
        var k = d.getAttribute("data-sec");
        if (!k) return;
        secState[k] = d.open;
        try { localStorage.setItem(SEC_PREFIX + k, d.open ? "1" : "0"); } catch (e) {}
      });
    });

    var sub = allEvents.length + (allEvents.length === 1 ? " event" : " events");
    if (meta && (meta.lastRunLabel || meta.generatedAt)) {
      sub += "  ·  updated " + (meta.lastRunLabel || String(meta.generatedAt).slice(0, 10));
    }
    document.getElementById("sub").textContent = sub;
  }

  // ----- Filters: apply to both views, reflect in the chips, mirror to the URL -----
  var SRC_CODE = { luma: "Luma", meetup: "Meetup", dojo: "Hacker Dojo", other: "Other" };
  var SRC_REV = { "Luma": "luma", "Meetup": "meetup", "Hacker Dojo": "dojo", "Other": "other" };

  function syncFilterUI() {
    var bar = document.getElementById("filterBar");
    if (!bar) return;
    function set(sel, on) { var el = bar.querySelector(sel); if (el) el.classList.toggle("on", !!on); }
    set('[data-f="score"]', filters.minScore === 4);
    set('[data-src="luma"]', !!(filters.sources && filters.sources.indexOf("Luma") >= 0));
    set('[data-src="meetup"]', !!(filters.sources && filters.sources.indexOf("Meetup") >= 0));
    set('[data-src="dojo"]', !!(filters.sources && filters.sources.indexOf("Hacker Dojo") >= 0));
    set('[data-set="inperson"]', filters.setting === "inperson");
    set('[data-set="online"]', filters.setting === "online");
    set('[data-f="sf"]', filters.dist === "sf");
    set('[data-f="hide"]', filters.hide);
    var inp = document.getElementById("fSearch");
    if (inp && document.activeElement !== inp && inp.value !== filters.q) inp.value = filters.q;
    document.getElementById("fClear").hidden = !filtersActive();
    bar.classList.toggle("filtered", filtersActive());
    var shown = allEvents.length + tbc.length, total = rawEvents.length;
    document.getElementById("fCount").textContent =
      filtersActive() ? (shown + " of " + total + " shown") : (total + (total === 1 ? " event" : " events"));
  }

  function applyFilters() {
    rebuild();
    if (view === "list") renderList();
    else { renderTBC(); render(); }
    syncFilterUI();
    writeURL();
  }

  function readURL() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return; }
    var v = q.get("v"); if (v === "list" || v === "calendar") view = v;
    var m = q.get("m");
    if (m && /^\d{4}-\d{1,2}$/.test(m)) {
      var pp = m.split("-"), yy = +pp[0], mm = +pp[1] - 1;
      if (mm >= 0 && mm <= 11) { ref = { y: yy, m: mm }; urlRefSet = true; }
    }
    filters.q = q.get("q") || "";
    filters.minScore = q.get("s") === "4" ? 4 : 0;
    var src = q.get("src");
    filters.sources = src ? src.split(",").map(function (c) { return SRC_CODE[c]; }).filter(Boolean) : null;
    if (filters.sources && !filters.sources.length) filters.sources = null;
    var set = q.get("set"); filters.setting = (set === "inperson" || set === "online") ? set : "all";
    filters.dist = q.get("dist") === "sf" ? "sf" : "all";
    filters.hide = q.get("hide") === "1";
  }

  function writeURL() {
    var q = new URLSearchParams();
    q.set("v", view);
    if (view === "calendar") q.set("m", ref.y + "-" + pad(ref.m + 1));
    if (filters.q) q.set("q", filters.q);
    if (filters.minScore) q.set("s", "4");
    if (filters.sources) q.set("src", filters.sources.map(function (s) { return SRC_REV[s]; }).join(","));
    if (filters.setting !== "all") q.set("set", filters.setting);
    if (filters.dist === "sf") q.set("dist", "sf");
    if (filters.hide) q.set("hide", "1");
    try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (e) {}
  }

  function setView(v) {
    view = (v === "list") ? "list" : "calendar";
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
    document.body.classList.toggle("view-list", view === "list");
    [].forEach.call(document.querySelectorAll("#viewToggle .vt"), function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-view") === view ? "true" : "false");
    });
    closeDayPop();
    var cals = document.getElementById("cals");
    var list = document.getElementById("listView");
    if (view === "list") {
      cals.hidden = true;
      document.getElementById("tbcShelf").hidden = true;
      list.hidden = false;
      renderList();
    } else {
      list.hidden = true;
      cals.hidden = false;
      renderTBC();
      render();
    }
    writeURL();
    window.scrollTo(0, 0);
  }

  // ----- Navigation (synchronized: any arrow shifts all three) -----
  function shift(delta) {
    closeDayPop();
    var y = window.scrollY;
    ref = addMonths(ref.y, ref.m, delta);
    render();
    writeURL();
    window.scrollTo(0, y); // preserve scroll position on navigation
  }

  function goToday() {
    closeDayPop();
    var t = today();
    ref = { y: t.y, m: t.m };
    render();
    writeURL();
    window.scrollTo(0, 0);
  }

  // ----- Month / year picker -----
  function openPicker(panelIndex) {
    pickerPanelIndex = panelIndex;
    var shown = addMonths(ref.y, ref.m, panelIndex);
    document.getElementById("pickMonth").value = String(shown.m);
    document.getElementById("pickYear").value = String(shown.y);
    document.getElementById("pickerOverlay").classList.add("open");
    document.getElementById("pickMonth").focus();
  }
  function closePicker() { document.getElementById("pickerOverlay").classList.remove("open"); }
  function confirmPicker() {
    var m = parseInt(document.getElementById("pickMonth").value, 10);
    var y = parseInt(document.getElementById("pickYear").value, 10);
    if (isNaN(y) || isNaN(m)) { closePicker(); return; }
    // The chosen month lands in the panel whose heading was clicked;
    // the reference month is offset back by that panel's index.
    ref = addMonths(y, m, -pickerPanelIndex);
    closePicker();
    closeDayPop();
    render();
    writeURL();
    window.scrollTo(0, 0);
  }

  // ----- Day popover: anchored to the clicked cell, fit-to-content with capped scroll -----
  var dpSel = -1; // keyboard-selected row index

  function openDayPop(key, rect) {
    var evs = byDate[key] || [];
    if (!evs.length) return;
    var parts = key.split("-");
    var y = +parts[0], m = +parts[1] - 1, d = +parts[2];
    document.getElementById("dpTitle").textContent =
      DOW[new Date(y, m, d).getDay()] + ", " + MONTHS_SHORT[m] + " " + d + " · " +
      evs.length + (evs.length === 1 ? " event" : " events");
    var list = document.getElementById("dpList");
    list.innerHTML = evs.map(function (ev, i) {
      var meter = "";
      for (var k = 1; k <= 5; k++) meter += '<i class="' + (k <= (ev.score || 0) ? "on" : "") + '"></i>';
      var pills = "";
      if (ev.status === "new") pills += '<span class="pill new">new</span> ';
      if (ev.distanceNote) pills += '<span class="pill dist">' + esc(ev.distanceNote.split("—")[0].trim()) + "</span> ";
      if (ev.needsVerification) pills += '<span class="pill verify">verify</span> ';
      var time = ev.startTime ? (ev.startTime + (ev.endTime ? "–" + ev.endTime : "") + " " + (ev.tz || "PT")) : "";
      var loc = [ev.venue, ev.city].filter(Boolean).join(", ");
      return '<a class="dp-row" data-i="' + i + '" href="' + esc(ev.url) + '" target="_blank" rel="noopener">' +
        '<div class="r-top"><span class="r-name">' + esc(ev.name) + "</span>" +
        '<span class="meter">' + meter + "</span></div>" +
        '<div class="r-meta"><span>' + esc(time) + "</span><span>" + esc(loc) + "</span>" +
        (ev.price ? "<span>" + esc(ev.price) + "</span>" : "") + "</div>" +
        (pills ? '<div class="r-meta">' + pills + "</div>" : "") + "</a>";
    }).join("");
    dpSel = -1;
    list.scrollTop = 0;

    // Measure, then place — fit to content (max-height caps it), flipping near edges.
    var pop = document.getElementById("dayPop");
    pop.hidden = false;
    pop.style.visibility = "hidden";
    pop.style.left = "0px";
    pop.style.top = "0px";
    var pr = pop.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight, M = 12, G = 6, w = pr.width, h = pr.height;
    var left = rect.left;
    if (left + w > vw - M) left = rect.right - w;           // flip leftward near the right edge
    left = Math.max(M, Math.min(left, vw - w - M));
    var top = rect.bottom + G;
    if (top + h > vh - M) {                                  // flip above near the bottom edge
      var above = rect.top - G - h;
      top = (above >= M) ? above : Math.max(M, vh - h - M);
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
    pop.style.visibility = "visible";
  }
  function closeDayPop() {
    var p = document.getElementById("dayPop");
    if (!p.hidden) { p.hidden = true; dpSel = -1; }
  }
  function dpOpen() { return !document.getElementById("dayPop").hidden; }
  function dpMove(delta) {
    var rows = document.querySelectorAll("#dpList .dp-row");
    if (!rows.length) return;
    dpSel = (dpSel + delta + rows.length) % rows.length;
    rows.forEach(function (r, i) { r.classList.toggle("sel", i === dpSel); });
    rows[dpSel].scrollIntoView({ block: "nearest" });
  }
  function dpEnter() {
    var rows = document.querySelectorAll("#dpList .dp-row");
    if (dpSel >= 0 && rows[dpSel]) window.open(rows[dpSel].href, "_blank", "noopener");
  }

  // ----- Events wiring (delegated) -----
  function wire() {
    var THEME_KEY = "radar-theme";
    var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    document.getElementById("themeToggle").addEventListener("click", function () {
      theme = (theme === "light") ? "dark" : "light";
      if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    });
    document.getElementById("todayBtn").addEventListener("click", function () {
      if (view === "calendar") goToday(); else window.scrollTo(0, 0);
    });
    document.getElementById("viewToggle").addEventListener("click", function (e) {
      var b = e.target.closest(".vt");
      if (b) setView(b.getAttribute("data-view"));
    });

    // TBC shelf remembers whether it's collapsed (default: expanded)
    var TBC_KEY = "radar-tbc-open";
    var tbcEl = document.getElementById("tbcShelf");
    try { tbcEl.open = localStorage.getItem(TBC_KEY) === "1"; } catch (e) { tbcEl.open = false; }
    tbcEl.addEventListener("toggle", function () {
      try { localStorage.setItem(TBC_KEY, tbcEl.open ? "1" : "0"); } catch (e) {}
    });

    // Filter bar
    document.getElementById("filterBar").addEventListener("click", function (e) {
      var chip = e.target.closest(".fchip");
      if (!chip) return;
      if (chip.id === "fClear") {
        filters = { minScore: 0, sources: null, setting: "all", dist: "all", hide: false, q: "" };
      } else if (chip.getAttribute("data-f") === "score") {
        filters.minScore = filters.minScore ? 0 : 4;
      } else if (chip.getAttribute("data-f") === "sf") {
        filters.dist = filters.dist === "sf" ? "all" : "sf";
      } else if (chip.getAttribute("data-f") === "hide") {
        filters.hide = !filters.hide;
      } else if (chip.getAttribute("data-set")) {
        var s = chip.getAttribute("data-set");
        filters.setting = (filters.setting === s) ? "all" : s;
      } else if (chip.getAttribute("data-src")) {
        var name = SRC_CODE[chip.getAttribute("data-src")];
        var cur = filters.sources ? filters.sources.slice() : [];
        var idx = cur.indexOf(name);
        if (idx >= 0) cur.splice(idx, 1); else cur.push(name);
        filters.sources = cur.length ? cur : null;
      } else { return; }
      applyFilters();
    });
    var searchEl = document.getElementById("fSearch");
    var searchT;
    searchEl.addEventListener("input", function () {
      clearTimeout(searchT);
      searchT = setTimeout(function () {
        var v = searchEl.value.trim();
        if (v !== filters.q) { filters.q = v; applyFilters(); }
      }, 180);
    });

    document.getElementById("cals").addEventListener("click", function (e) {
      var nav = e.target.closest("[data-nav]");
      if (nav) { shift(nav.getAttribute("data-nav") === "prev" ? -1 : 1); return; }
      var pick = e.target.closest("[data-pick]");
      if (pick) { openPicker(parseInt(pick.getAttribute("data-pick"), 10)); return; }
      // clicking a day cell (not a chip link) opens its popover, anchored to the cell
      if (!e.target.closest("a.ev")) {
        var cell = e.target.closest(".cell.has");
        if (cell) { openDayPop(cell.getAttribute("data-day"), cell.getBoundingClientRect()); }
      }
    });

    document.getElementById("pickCancel").addEventListener("click", closePicker);
    document.getElementById("pickConfirm").addEventListener("click", confirmPicker);
    document.getElementById("dpClose").addEventListener("click", closeDayPop);

    // picker overlay click-out
    document.getElementById("pickerOverlay").addEventListener("click", function (e) {
      if (e.target === this) closePicker();
    });
    // click outside the popover (and not on a day cell, which opens its own) closes it
    document.addEventListener("click", function (e) {
      if (dpOpen() && !e.target.closest("#dayPop") && !e.target.closest(".cell.has")) closeDayPop();
    });
    // the popover is anchored to a cell, so on scroll/resize just close it rather than chase the cell
    window.addEventListener("scroll", closeDayPop, true);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closePicker(); closeDayPop(); return; }
      if (document.getElementById("pickerOverlay").classList.contains("open")) {
        if (e.key === "Enter") confirmPicker();
        return;
      }
      if (dpOpen()) {
        if (e.key === "ArrowDown") { e.preventDefault(); dpMove(1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); dpMove(-1); }
        else if (e.key === "Enter") { e.preventDefault(); dpEnter(); }
      }
    });

    // populate month dropdown
    var sel = document.getElementById("pickMonth");
    sel.innerHTML = MONTHS.map(function (m, i) { return '<option value="' + i + '">' + m + "</option>"; }).join("");

    // re-render when orientation flips between stacked (portrait) and single-fill (landscape)
    var mode = singleMode();
    window.addEventListener("resize", function () {
      closeDayPop(); // its anchor would be stale after a resize
      var m = singleMode();
      if (m !== mode) { mode = m; render(); }
      else adjustTbc();   // same orientation, different aspect: re-check TBC fit
    });
    var mq = window.matchMedia("(orientation: landscape)");
    if (mq.addEventListener) {
      mq.addEventListener("change", function () { mode = singleMode(); render(); });
    }

    // In single-month (landscape) fill mode the page doesn't scroll, so the wheel
    // navigates months: down = next, up = previous. Portrait keeps normal page scroll.
    var wheelLock = 0;
    window.addEventListener("wheel", function (e) {
      if (view !== "calendar") return;                         // list view → normal page scroll
      if (!singleMode()) return;                               // portrait → let the page scroll
      if (document.querySelector(".overlay.open")) return;     // picker is open → let it scroll
      if (dpOpen()) return;                                    // popover open → let its list scroll
      e.preventDefault();
      if (Math.abs(e.deltaY) < 6) return;
      var now = Date.now();
      if (now - wheelLock < 320) return;                       // one notch = one month
      wheelLock = now;
      shift(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });
  }

  // ----- Boot -----
  wire();
  readURL();                      // deep-link params set view / month / filters
  var t = today();
  if (!urlRefSet) ref = { y: t.y, m: t.m };
  loadData().then(function (data) {
    normalize(data);              // rebuild() applies the filters from the URL
    renderStale();
    syncFilterUI();
    // Collapsed by default; opens on load only when a deep link arrives with filters set.
    document.getElementById("filterBar").open = filtersActive();
    setView(view);                // renders the chosen view (and normalizes the URL)
  });
})();
</script>
</body>
</html>
